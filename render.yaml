services:
  - type: web
    name: personal-academic-ai-agent
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CAMBER_API_KEY
        sync: false
